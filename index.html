<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ArmoryPro — inventario inteligente de armas y munición. Enlaces legales y privacidad." />
  <title>ArmoryPro</title>
  <style>
    :root {
      --bg: #050c12;
      --fg: #f4f6f8;
      --muted: #9aa5b1;
      --accent: #3b82f6;
      --card: #0d1620;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
      line-height: 1.5;
    }
    main {
      max-width: 28rem;
      text-align: center;
    }
    .logo {
      width: 5.5rem;
      height: 5.5rem;
      object-fit: contain;
      margin-bottom: 1.25rem;
      border-radius: 12px;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 2rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
    a.privacy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 10px;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    a.privacy:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    a.subtle {
      display: inline-block;
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.875rem;
      text-decoration: none;
    }
    a.subtle:hover {
      color: var(--fg);
      text-decoration: underline;
    }
    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    code {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" width="88" height="88" alt="ArmoryPro" class="logo" />
    <h1>ArmoryPro</h1>
    <p class="tagline">Inventario inteligente</p>

    <div class="card">
      <p>
        Gestión profesional de inventario de armas y munición en Android.
        <br /><br />
        <strong style="color: var(--fg);">Legal y privacidad</strong>
      </p>
    </div>

    <a class="privacy" href="https://armorypro.app/privacy/" rel="noopener noreferrer">
      Política de privacidad
    </a>

    <a class="subtle" href="mailto:armorypro.app@gmail.com">Contacto</a>

    <footer>
      <code>app.armorypro.inventory</code>
      <br />
      © 2026 ArmoryPro
    </footer>
  </main>
</body>
</html>
